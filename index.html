<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Mensual</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body class="bg-light" style="font-family: Arial, Helvetica, sans-serif;">

    <div class="bg-light text-center py-4">
        <h5 id="titulo" class="font-weight-bold">Presupuesto de Septiembre 2026</h5>
        <h1 id="saldo" class="display-4 font-weight-bold">+ 500.00</h1>
        <div class="col-10 col-sm-6 col-md-4 mx-auto bg-dark text-white d-flex justify-content-between p-2 mb-2">
            <span>INGRESOS:</span>
            <span id="totalIngresos">+800.00</span>
        </div>
        <div
            class="col-10 col-sm-6 col-md-4 mx-auto bg-white border border-dark d-flex justify-content-between p-2 mb-2">
            <span>EGRESOS:</span>
            <span id="totalEgresos">-300.00</span>
        </div>
        <div>Porcentaje de gastos: <span id="porcGlobal" class="badge badge-dark">38%</span></div>
    </div>

    <div class="container mt-4 mb-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="bg-white border p-4">
                    <h5><span class="border rounded-circle text-muted px-2 mr-1">+</span> Transacción</h5>
                    <div class="form-group mt-3">
                        <select id="tipo" class="form-control">
                            <option value="ingreso">Ingreso</option>
                            <option value="egreso">Egreso</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" id="descripcion" class="form-control" placeholder="Descripción">
                    </div>
                    <div class="form-group">
                        <input type="number" id="monto" class="form-control" placeholder="Monto">
                    </div>
                    <button class="btn btn-dark px-4" onclick="agregar()">Agregar</button>
                    <p id="error" class="text-danger small mt-2"></p>
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <div class="d-flex mt-3">
                    <button id="tabIng" class="btn btn-dark w-50 rounded-0" onclick="ver('ingreso')">Ingresos</button>
                    <button id="tabEgr" class="btn btn-secondary w-50 rounded-0"
                        onclick="ver('egreso')">Egresos</button>
                </div>
                <div id="lista"></div>
            </div>
        </div>
    </div>

    

</body>

</html>
