<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Mensual</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body class="bg-light" style="font-family: Arial, Helvetica, sans-serif;">

    <div class="bg-light text-center py-4">
        <h5 id="titulo" class="font-weight-bold">Presupuesto de Septiembre 2026</h5>
        <h1 id="saldo" class="display-4 font-weight-bold">+ 500.00</h1>
        <div class="col-10 col-sm-6 col-md-4 mx-auto bg-dark text-white d-flex justify-content-between p-2 mb-2">
            <span>INGRESOS:</span>
            <span id="totalIngresos">+800.00</span>
        </div>
        <div
            class="col-10 col-sm-6 col-md-4 mx-auto bg-white border border-dark d-flex justify-content-between p-2 mb-2">
            <span>EGRESOS:</span>
            <span id="totalEgresos">-300.00</span>
        </div>
        <div>Porcentaje de gastos: <span id="porcGlobal" class="badge badge-dark">38%</span></div>
    </div>

    <div class="container mt-4 mb-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="bg-white border p-4">
                    <h5><span class="border rounded-circle text-muted px-2 mr-1">+</span> Transacción</h5>
                    <div class="form-group mt-3">
                        <select id="tipo" class="form-control">
                            <option value="ingreso">Ingreso</option>
                            <option value="egreso">Egreso</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" id="descripcion" class="form-control" placeholder="Descripción">
                    </div>
                    <div class="form-group">
                        <input type="number" id="monto" class="form-control" placeholder="Monto">
                    </div>
                    <button class="btn btn-dark px-4" onclick="agregar()">Agregar</button>
                    <p id="error" class="text-danger small mt-2"></p>
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <div class="d-flex mt-3">
                    <button id="tabIng" class="btn btn-dark w-50 rounded-0" onclick="ver('ingreso')">Ingresos</button>
                    <button id="tabEgr" class="btn btn-secondary w-50 rounded-0"
                        onclick="ver('egreso')">Egresos</button>
                </div>
                <div id="lista"></div>
            </div>
        </div>
    </div>

    <script>
        class Ingreso {
            constructor(id, descripcion, valor) {
                this.id = id;
                this.descripcion = descripcion;
                this.valor = valor;
            }
        }

        class Egreso {
            constructor(id, descripcion, valor) {
                this.id = id;
                this.descripcion = descripcion;
                this.valor = valor;
            }
        }

        let ingresos = [
            new Ingreso(1, "Sueldo", 400),
            new Ingreso(2, "Venta", 400)
        ];

        let egresos = [
            new Egreso(1, "Renta", 200),
            new Egreso(2, "Comida", 100)
        ];

        let idIngreso = 3;
        let idEgreso = 3;
        let pestaña = "ingreso";

        function titulo() {
            let meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            let fecha = new Date();
            document.getElementById("titulo").textContent = "Presupuesto de " + meses[fecha.getMonth()] + " " + fecha.getFullYear();
        }

        function totalIngresos() {
            let total = 0;
            for (let i = 0; i < ingresos.length; i++) {
                total += ingresos[i].valor;
            }
            return total;
        }

        function totalEgresos() {
            let total = 0;
            for (let i = 0; i < egresos.length; i++) {
                total += egresos[i].valor;
            }
            return total;
        }

        function actualizar() {
            let ing = totalIngresos();
            let egr = totalEgresos();
            let saldo = ing - egr;

            if (saldo >= 0) {
                document.getElementById("saldo").textContent = "+ " + saldo.toFixed(2);
            } else {
                document.getElementById("saldo").textContent = "- " + Math.abs(saldo).toFixed(2);
            }

            document.getElementById("totalIngresos").textContent = "+ " + ing.toFixed(2);
            document.getElementById("totalEgresos").textContent = "- " + egr.toFixed(2);

            let porc = 0;
            if (ing > 0) {
                porc = (egr * 100) / ing;
            }
            document.getElementById("porcGlobal").textContent = Math.round(porc) + "%";
        }

        function ver(tipo) {
            pestaña = tipo;
            if (tipo == "ingreso") {
                document.getElementById("tabIng").className = "btn btn-dark w-50 rounded-0";
                document.getElementById("tabEgr").className = "btn btn-secondary w-50 rounded-0";
            } else {
                document.getElementById("tabEgr").className = "btn btn-dark w-50 rounded-0";
                document.getElementById("tabIng").className = "btn btn-secondary w-50 rounded-0";
            }
            mostrar();
        }

        function mostrar() {
            let lista = document.getElementById("lista");
            lista.innerHTML = "";
            let ing = totalIngresos();

            if (pestaña == "ingreso") {
                for (let i = 0; i < ingresos.length; i++) {
                    let div = document.createElement("div");
                    div.className = "list-group-item d-flex justify-content-between align-items-center bg-white mt-2";
                    div.innerHTML = "<span>" + ingresos[i].descripcion + "</span><span>+ " + ingresos[i].valor.toFixed(2) + "<button class='btn btn-link btn-sm text-muted' onclick='eliminarIngreso(" + ingresos[i].id + ")'>x</button></span>";
                    lista.appendChild(div);
                }
            } else {
                for (let j = 0; j < egresos.length; j++) {
                    let p = 0;
                    if (ing > 0) {
                        p = (egresos[j].valor * 100) / ing;
                    }
                    let div2 = document.createElement("div");
                    div2.className = "list-group-item d-flex justify-content-between align-items-center bg-white mt-2";
                    div2.innerHTML = "<span>" + egresos[j].descripcion + "</span><span>- " + egresos[j].valor.toFixed(2) + "<span class='badge badge-dark ml-2'>" + Math.round(p) + "%</span><button class='btn btn-link btn-sm text-muted' onclick='eliminarEgreso(" + egresos[j].id + ")'>x</button></span>";
                    lista.appendChild(div2);
                }
            }
        }

        function agregar() {
            let tipo = document.getElementById("tipo").value;
            let desc = document.getElementById("descripcion").value.trim();
            let monto = parseFloat(document.getElementById("monto").value);
            let error = document.getElementById("error");
            error.textContent = "";

            if (desc == "") {
                error.textContent = "Ingrese una descripción.";
                return;
            }
            if (isNaN(monto) || monto <= 0) {
                error.textContent = "Ingrese un monto válido mayor a 0.";
                return;
            }

            if (tipo == "ingreso") {
                ingresos.push(new Ingreso(idIngreso, desc, monto));
                idIngreso++;
                ver("ingreso");
            } else {
                egresos.push(new Egreso(idEgreso, desc, monto));
                idEgreso++;
                ver("egreso");
            }

            document.getElementById("descripcion").value = "";
            document.getElementById("monto").value = "";
            actualizar();
            mostrar();
        }

        function eliminarIngreso(id) {
            ingresos = ingresos.filter(function (e) { return e.id != id; });
            actualizar();
            mostrar();
        }

        function eliminarEgreso(id) {
            egresos = egresos.filter(function (e) { return e.id != id; });
            actualizar();
            mostrar();
        }

        titulo();
        actualizar();
        mostrar();
    </script>

</body>

</html>
